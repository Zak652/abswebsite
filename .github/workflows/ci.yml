name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run for the same PR/branch when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend-lint:
    name: Frontend · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: Frontend · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `next build` regenerates .next/types so tsc has the latest route types.
      # Skip linting since frontend-lint covers that.
      - name: Build (generates route types)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: tsc --noEmit
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend · vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend · ruff (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      # `--select F` runs only pyflakes (real bugs: unused imports, undefined
      # names, etc.). Style rules (E, W) are deliberately not gated yet —
      # tightening lives in a follow-up once the codebase is reflowed.
      - name: ruff check --select F
        run: ruff check --select F backend

  backend-test:
    name: Backend · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: abs_db
          POSTGRES_USER: abs_user
          POSTGRES_PASSWORD: abs_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abs_user -d abs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: abs_backend.settings.local
      DJANGO_SECRET_KEY: ci-django-secret-key-not-real
      JWT_SECRET: ci-jwt-secret-not-real-32-chars-aa
      REVALIDATION_SECRET: ci-revalidation-secret-not-real
      DEBUG: "True"
      POSTGRES_DB: abs_db
      POSTGRES_USER: abs_user
      POSTGRES_PASSWORD: abs_dev_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      FLUTTERWAVE_WEBHOOK_SECRET: ci-fw-webhook-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest
        run: pytest --quiet

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security · audit (warn-only)
    runs-on: ubuntu-latest
    # Don't gate merges on advisories yet — we want visibility, not friction,
    # while we figure out the right baseline. Promote to required once the
    # noise level is known.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt || true

  gitleaks:
    name: Security · gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan rotated secrets.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
